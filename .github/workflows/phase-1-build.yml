name: Phase 1 build check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/phase-1-functional-navigation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
